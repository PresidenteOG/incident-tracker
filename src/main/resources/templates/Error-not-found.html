<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <title>No encontrado</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 25px;
    }

    .card {
      background: #fff;
      max-width: 420px;
      margin: 60px auto;
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
      text-align: center;
    }

    h2 {
      color: #2d3748;
      font-size: 24px;
    }

    p {
      color: #a00000;
    }

    .back-link {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      color: #fff;
      background: #28a745;
      padding: 8px 14px;
      border-radius: 6px;
    }

    .back-link:hover {
      background: #1e8438;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>No encontrado</h2>
    <p th:text="${message}"></p>
    <a class="back-link" th:href="@{/Incidencia}">Volver al listado</a>
  </div>
</body>
</html>
