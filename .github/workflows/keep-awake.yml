name: Keep demo awake

# Render's free tier puts the live demo to sleep after 15 minutes without
# traffic, and waking it takes about two minutes. One request every 10 minutes
# keeps it up. GitHub can delay scheduled runs, so a cold start still happens
# now and then.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the demo
        run: curl -sS -o /dev/null -w '%{http_code} in %{time_total}s\n' --max-time 240 https://incident-tracker-6sbn.onrender.com/
